<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="Food Tower: a restaurant journal for pilots and frequent travellers." />
    <title>Food Tower</title>
    <script>
      // Apply the saved theme before first paint (avoids a flash). Dark is the default.
      // Reads the same key Zustand's persist middleware writes (see src/store/uiStore.ts).
      try {
        var s = JSON.parse(localStorage.getItem('food-tower:ui') || '{}');
        if (s.state && s.state.theme === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
